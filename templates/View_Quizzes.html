<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous" />
    <link rel="stylesheet" href="../static/styles/main.css" />
</head>

<body>
    <div class="user_form">
        <form action="/view_quizzes/{{ quiz_view.id }}" method="POST">
            <h3 style="color: rgba(226, 38, 38, 0.816)">New Quiz</h3><br>
            <div class="input_box">
                <label for="date">Date</label>
                <input type="date" id="date" placeholder="Enter Exam Date" name="date_quiz" value="{{quiz_view.date_of_quiz}}"  required />
            </div>
            <div class="input_box">
                <label for="duration">Duration</label>
                <input type="time" id="duration" placeholder="Enter Exam Duration" name="quiz_duration" value="{{quiz_view.time_duration}}" required />
            </div><br>
            <div class="bottom_row_for_page">
                <div><button class="btn btn-primary" type="submit" name='action' value='edit'>Edit</button></div>
                <div><button class="btn btn-danger" type="submit" name='action' value='delete'>Delete</button></div>
            </div>
            <div style=" padding-left: 25%; padding-right: 25%;">
                <button  class="btn btn-secondary" type="submit" name='action' value='back'>Go Back</button>
            </div>
        </form>
    </div>
</body>

</html>
