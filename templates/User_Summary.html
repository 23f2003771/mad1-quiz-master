<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous" />
  <link rel="stylesheet" href="../static/styles/userside.css" />
  <title>Summary Charts - Quiz Master</title>
  <style>
    .nav-pills {
      background-color: #e3f2fd;
      padding: 10px;
      border-radius: 5px;
    }
    .nav-pills .nav-link {
      color: #000;
      margin: 0 5px;
    }
    .nav-pills .nav-link.active {
      background-color: #007bff;
      color: white;
    }
    .welcome-text {
      color: #007bff;
      margin-left: 15px;
    }
  </style>
</head>

<body>
  <div class="container-fluid">
    <div class="row align-items-center py-2" style="background-color: #e3f2fd;">
      <div class="col">
        <ul class="nav nav-pills">
          <li class="nav-item">
            <a class="nav-link" href="/user_dashboard">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/quiz_history">Scores</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="/user_summary">Summary</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/logout">Logout</a>
          </li>
        </ul>
      </div>
      <div class="col-auto">
        <form class="form-inline" action="/user_search" method="POST">
          <input class="form-control mr-2" type="search" name="search_query" placeholder="Search" />
          <button class="btn btn-outline-primary" type="submit">Search</button>
        </form>
      </div>
      <div class="col-auto">
        <span class="welcome-text">Welcome User</span>
      </div>
    </div>
  </div>

  <div class="container" style="padding-top: 20px;">
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header">
            <h3 style="font-family: 'Faculty Glyphic';"><b>Summary Charts</b></h3>
          </div>
          <div class="card-body text-center">
            <img src="{{ url_for('static', filename=chart_image) }}" alt="Summary Charts" class="img-fluid">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
    integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
    integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
    crossorigin="anonymous"></script>
</body>

</html>
