<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous" />
    <link rel="stylesheet" href="../static/styles/main.css" />
</head>

<body>
    <div class="user_form">
        <form action="/new_chapter/{{ sub_code }}" method="POST">
            <h3 style="color: rgba(226, 38, 38, 0.816)">New Chapter</h3><br>
            <div class="input_box">
                <label for="chap_id">Chapter ID</label>
                <input type="text" id="chap_id" name="chap_id" placeholder="Enter Chapter ID" required />
            </div>
            <div class="input_box">
                <label for="name">Chapter Name</label>
                <input type="text" id="name" name="chap_name" placeholder="Enter Chapter Name" required />
            </div>
            <div class="input_box">
                <label for="description">Description</label>
                <input type="text" id="description" name="chap_desc" placeholder="Enter Description" required />
            </div><br>
            <div class="bottom_row_for_page">
                <div><button class="btn btn-primary" type="submit" name='action' value='save'>Save</button></div>
                <div><button class="btn btn-danger" type="submit" name='action' value='cancel'>Cancel</button></div>
            </div>
        </form>
    </div>
</body>

</html>
