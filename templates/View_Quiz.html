<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous" />
  <link rel="stylesheet" href="../static/styles/userside.css" />
  <title>View Quiz - Quiz Master</title>
  <style>
    .quiz-info {
      max-width: 500px;
      margin: 50px auto;
      padding: 30px;
      border: 1px solid #dee2e6;
      border-radius: 10px;
      background-color: white;
    }
    .info-row {
      margin: 15px 0;
      display: flex;
      align-items: center;
    }
    .info-label {
      width: 200px;
      color: #0066cc;
      font-weight: bold;
    }
    .info-value {
      flex: 1;
      padding: 5px 10px;
      border: 1px solid #dee2e6;
      border-radius: 5px;
      background-color: #fff;
    }
    .close-btn {
      display: block;
      width: 100px;
      margin: 20px auto 0;
      padding: 8px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .close-btn:hover {
      background-color: #0052a3;
      color: white;
      text-decoration: none;
    }
    h2 {
      color: #0066cc;
      text-align: center;
      margin-bottom: 30px;
    }
  </style>
</head>

<body>
  <div class="quiz-info">
    <h2>View the Quiz</h2>
    
    <div class="info-row">
      <div class="info-label">ID:</div>
      <div class="info-value">{{ quiz.id }}</div>
    </div>

    <div class="info-row">
      <div class="info-label">Subject:</div>
      <div class="info-value">{{ quiz.subject_name }}</div>
    </div>

    <div class="info-row">
      <div class="info-label">Chapter:</div>
      <div class="info-value">{{ quiz.chapter_name }}</div>
    </div>

    <div class="info-row">
      <div class="info-label">Number of Questions:</div>
      <div class="info-value">{{ quiz.total_questions }}</div>
    </div>

    <div class="info-row">
      <div class="info-label">Scheduled Date:</div>
      <div class="info-value">{{ quiz.date_of_quiz.strftime('%d/%m/%Y') }}</div>
    </div>

    <div class="info-row">
      <div class="info-label">Duration(hh:mm):</div>
      <div class="info-value">{{ quiz.time_duration.strftime('%H:%M') }}</div>
    </div>

    <a href="/user_dashboard" class="close-btn">Close</a>
  </div>

  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
    integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
    integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
    crossorigin="anonymous"></script>
</body>

</html>
