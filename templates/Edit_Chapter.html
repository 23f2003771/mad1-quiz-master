<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../static/styles/main.css" />
</head>

<body>
    <div class="user_form">
        <form action="/edit_chapter/{{ chapter_edit.chapter_id }}" method="POST">
            <h3 style="color: rgba(226, 38, 38, 0.816)">Edit Chapter</h3><br>
            <div class="input_box">
                <label for="name">Subject Code</label>
                <input type="text" id="name" name = "sub_code" placeholder="Enter Subject Code" value="{{ chapter_edit.subject_code_chapter }}" required />
            </div>
            <div class="input_box">
                <label for="name">Chapter Code</label>
                <input type="text" id="name" name = "Chap_code" placeholder="Enter Chapter Code" value="{{ chapter_edit.chapter_id }}" required />
            </div>
            <div class="input_box">
                <label for="name">Chapter Name</label>
                <input type="text" id="name" name="chap_name" placeholder="Enter Chapter Name" value="{{ chapter_edit.chapter_name }}" required />
            </div>
            <div class="input_box">
                <label for="description">Description</label>
                <input type="text" id="description" name="chap_desc" placeholder="Enter Description" value="{{ chapter_edit.chapter_description }}" required />
            </div><br>
            <div class="bottom_row_for_page">
                <div><button type="submit" name = 'action' value = 'save'>Edit</button></div>
                <div><button type="submit" name = 'action' value = 'cancel'>Cancel</button></div>
            </div>
        </form>
    </div>
</body>

</html>
