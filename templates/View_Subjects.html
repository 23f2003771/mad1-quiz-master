<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Subjects</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous" />
    <link rel="stylesheet" href="../static/styles/main.css" />
</head>

<body>
    <div class="user_form">
        <form action="/view_subjects/{{ sub_view.Subject_code }}" method="POST">
            <b><h3 style=" color: rgba(226, 38, 38, 0.816);">{{ sub_view.Subject_code }} - {{ sub_view.subject_name }}</h3></b>
            <div class="input_box">
                <label for="name">Subject Name</label>
                <input type="text" id="name" name="sub_name" placeholder="Enter Subject" value="{{sub_view.subject_name}}" required />
            </div>
            <div class="input_box">
                <label for="description">Description</label>
                <input type="text" id="description" name="sub_desc" placeholder="Enter Description" value="{{sub_view.subject_description}}" required />
            </div><br>
            <div class="bottom_row_for_page">
                <div><button class="btn btn-primary" type="submit" name='action' value='edit'>Edit</button></div>
                <div><button class="btn btn-danger" type="submit" name='action' value='delete'>Delete</button></div>
            </div>
            <div style=" padding-left: 25%; padding-right: 25%;">
                <button  class="btn btn-secondary" type="submit" name='action' value='back'>Go Back</button>
            </div>
        </form>
    </div>
</body>

</html>
