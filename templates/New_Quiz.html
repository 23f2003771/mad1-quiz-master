<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous" />
    <link rel="stylesheet" href="../static/styles/main.css" />
</head>

<body>
    <div class="user_form">
        <form action="/new_quiz" method="POST">
            <h3 style="color: rgba(226, 38, 38, 0.816)">New Quiz</h3><br>
            <div class="input_box">
                <label for="Chapter_id">Chapter ID</label>
                <input type="text" id="Chapter_id" placeholder="Enter Chapter ID" name="chapter_id" required />
            </div>
            <div class="input_box">
                <label for="date">Date</label>
                <input type="date" id="date" placeholder="Enter Exam Date" name="date_quiz" required />
            </div>
            <div class="input_box">
                <label for="duration">Duration</label>
                <input type="time" id="duration" placeholder="Enter Exam Duration" name="quiz_duration" required />
            </div>
            <div class="bottom_row_for_page">
                <div><button class="btn btn-primary" type="submit" name='action' value='save'>Save</button></div>
                <div><button class="btn btn-danger" type="submit" name='action' value='cancel'>Cancel</button></div>
            </div>
        </form>
    </div>
</body>

</html>
